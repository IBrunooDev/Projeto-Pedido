<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf8f7">
  <meta name="description" content="Uma pergunta especial para você.">
  <title>Uma pergunta para você ❤️</title>

  <link rel="icon" type="image/png" href="src/img/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <main class="hero" aria-labelledby="pergunta-principal">
    <div class="hero__badge" aria-hidden="true">
      <span>♥</span>
    </div>

    <p class="hero__eyebrow">Tenho uma coisa para te perguntar</p>

    <h1 id="pergunta-principal">
      Você aceita viver<br>
      <span>esse momento comigo?</span>
    </h1>

    <p class="hero__text">
      É uma pergunta simples, mas a sua resposta importa muito para mim.
    </p>

    <div class="buttons" aria-label="Escolha uma resposta">
      <button id="sim" type="button" data-href="../Segunda tela/index.html">
        Sim <span aria-hidden="true">♥</span>
      </button>
      <button id="botao" type="button">Não</button>
    </div>

    <p class="hero__hint">Escolha com carinho.</p>
  </main>

  <script src="src/js/script.js"></script>
</body>
</html>
